name: 🔄 Update Ronaldo Quote

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 6 AM UTC (11:30 AM IST)
  workflow_dispatch:        # Manual trigger anytime

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run quote updater
        run: python update_quote.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" || (
            git add README.md
            git commit -m "⚽ Daily CR7 quote updated"
            git push
          )
